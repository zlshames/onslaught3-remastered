# Analyzer and lint settings shared by the app (analysis_options.yaml) and the core
# (packages/onslaught_core/analysis_options.yaml). Each of those includes its lints
# package's yaml and then this file; put a setting here when both should have it.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - prefer_const_literals_to_create_immutables
    - cancel_subscriptions
    - close_sinks
    - avoid_redundant_argument_values
