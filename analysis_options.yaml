# Lints for the Flutter app. Settings shared with the core live in
# analysis_options.shared.yaml; the core adds its own in
# packages/onslaught_core/analysis_options.yaml. `fvm flutter analyze` must be clean (R14).
include:
  - package:flutter_lints/flutter.yaml
  - analysis_options.shared.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - .legacy/**
    - build/**
    - '**/build/**'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
