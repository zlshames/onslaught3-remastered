  <path d="M12.00 2.20 L14.76 8.40 L21.51 9.11 L16.47 13.65 L17.88 20.29 L12.00 16.90 L6.12 20.29 L7.53 13.65 L2.49 9.11 L9.24 8.40 Z" fill="none" stroke="#805906" stroke-width="3.7" stroke-linejoin="round"/>
