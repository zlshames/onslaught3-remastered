<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- creep.8: the flying eyeball (SWF bitmap 665, 24×24) redrawn as vector. -->
  <defs>
    <linearGradient id="tail" x1="0.6" y1="6.6" x2="9" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E0404"/>
      <stop offset="1" stop-color="#8E1015"/>
    </linearGradient>
    <radialGradient id="ball" cx="12.2" cy="8.8" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F4ECE2"/>
      <stop offset="0.85" stop-color="#D9BFB3"/>
      <stop offset="1" stop-color="#B78C83"/>
    </radialGradient>
    <radialGradient id="iris" cx="13.3" cy="10.9" r="3.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5CFC6"/>
      <stop offset="0.6" stop-color="#6F918A"/>
      <stop offset="1" stop-color="#3B5551"/>
    </radialGradient>
  </defs>
  <!-- optic-nerve tail -->
  <path d="M8.4 9.2 C6.4 8.6 5.2 6.4 3.0 6.0 C2.1 5.85 1.3 6.1 0.7 6.6 C2.3 6.7 3.3 7.6 4.3 9.0 C5.4 10.6 6.4 12.6 8.1 13.9 Z"
        fill="url(#tail)" stroke="#190202" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M7.6 10.6 C6.0 9.6 5.0 7.7 3.0 7.0" fill="none" stroke="#D63A40" stroke-width="0.45" stroke-linecap="round"/>
  <!-- eyeball -->
  <circle cx="14.4" cy="11.9" r="7.2" fill="url(#ball)" stroke="#644D48" stroke-width="0.9"/>
  <!-- bloodshot rim on the far side -->
  <path d="M17.6 5.5 A7.2 7.2 0 0 1 17.6 18.3 A8.6 8.6 0 0 0 17.6 5.5 Z" fill="#B3121A" opacity="0.85"/>
  <!-- iris and pupil -->
  <circle cx="13.9" cy="11.5" r="3.7" fill="url(#iris)" stroke="#1F2B29" stroke-width="0.5"/>
  <circle cx="13.9" cy="11.5" r="1.45" fill="#050505"/>
  <!-- glints -->
  <ellipse cx="12.8" cy="10.2" rx="0.85" ry="0.65" fill="#FFFFFF"/>
  <path d="M9.4 7.4 A6 6 0 0 1 13.4 5.3" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
</svg>
