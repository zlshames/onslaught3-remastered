<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <radialGradient id="head" cx="10" cy="8.5" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A5E"/><stop offset="0.6" stop-color="#E02A2E"/><stop offset="1" stop-color="#A3121A"/></radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE23A"/><stop offset="1" stop-color="#F0A012"/></linearGradient>
  </defs>

  <!-- creep.2: the dragon-dance head (SWF bitmap 696) redrawn as vector.
       Drawn upright (horns up, beard down) and turned to face right like
       the other frames. -->
  <g transform="rotate(-90 12 12)">
    <path d="M7.80 5.00 Q7.10 2.75 7.60 0.50 Q8.20 2.25 10.00 4.00 Z" fill="url(#horn)" stroke="#845809" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 16.20 5.00 Q 16.90 2.75 16.40 0.50 Q 15.80 2.25 14.00 4.00 Z" fill="url(#horn)" stroke="#845809" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M4.40 7.60 Q2.60 5.30 1.60 3.00 Q3.70 4.20 6.60 5.40 Z" fill="url(#horn)" stroke="#845809" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 19.60 7.60 Q 21.40 5.30 22.40 3.00 Q 20.30 4.20 17.40 5.40 Z" fill="url(#horn)" stroke="#845809" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M12 3.2 C17.4 3.2 20.6 6.4 20.6 11.0 C20.6 15.0 18.6 19.4 12 19.6 C5.4 19.4 3.4 15.0 3.4 11.0 C3.4 6.4 6.6 3.2 12 3.2 Z" fill="url(#head)" stroke="#59090E" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- bulging eyes -->
    <circle cx="8.3" cy="8.6" r="1.75" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="0.55"/>
    <circle cx="15.7" cy="8.6" r="1.75" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="0.55"/>
    <circle cx="8.9" cy="9.0" r="0.75" fill="#000"/>
    <circle cx="15.1" cy="9.0" r="0.75" fill="#000"/>
    <!-- open mouth, tongue and one unbroken row of teeth -->
    <path d="M6.6 13.2 C8.4 12.6 15.6 12.6 17.4 13.2 C17.2 16.6 15.2 18.6 12 18.6 C8.8 18.6 6.8 16.6 6.6 13.2 Z" fill="#4A070B" stroke="#280306" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M9.4 15.6 C10.4 14.6 13.6 14.6 14.6 15.6 C14.0 16.9 13.1 17.4 12 17.4 C10.9 17.4 10.0 16.9 9.4 15.6 Z" fill="#F07A2A"/>
    <path d="M7.4 16.2 C8.6 18.0 10.2 18.6 12 18.6 C13.8 18.6 15.4 18.0 16.6 16.2 C15.4 17.2 13.8 17.6 12 17.6 C10.2 17.6 8.6 17.2 7.4 16.2 Z" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="0.45" stroke-linejoin="round"/>
    <!-- mustache: sweeps out past the head and curls at both ends -->
    <path d="M10.9 12.7 C9.2 13.9 5.0 14.3 2.4 11.4 C1.0 9.8 2.0 7.6 3.7 8.2 C4.8 8.6 4.6 10.1 3.5 9.9" fill="none" stroke="#A5A5A5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 13.10 12.70 C 14.80 13.90 19.00 14.30 21.60 11.40 C 23.00 9.80 22.00 7.60 20.30 8.20 C 19.20 8.60 19.40 10.10 20.50 9.90" fill="none" stroke="#A5A5A5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10.9 12.7 C9.2 13.9 5.0 14.3 2.4 11.4 C1.0 9.8 2.0 7.6 3.7 8.2 C4.8 8.6 4.6 10.1 3.5 9.9" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 13.10 12.70 C 14.80 13.90 19.00 14.30 21.60 11.40 C 23.00 9.80 22.00 7.60 20.30 8.20 C 19.20 8.60 19.40 10.10 20.50 9.90" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- small cloud beard -->
    <path d="M9.6 19.4 C9.0 20.6 9.8 21.8 10.9 21.6 C11.2 22.8 12.8 22.8 13.1 21.6 C14.2 21.8 15.0 20.6 14.4 19.4 Z" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
