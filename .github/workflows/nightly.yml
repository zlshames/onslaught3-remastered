# Nightly jobs (docs/REMASTER_PLAN.md §8.2): the balance bots, the perf
# budget and the headless 3× soak to wave 300; device integration (smoke
# flows plus the device soak) on the Android emulator and an iOS simulator;
# and a dependency audit. The release workflow runs the same gates.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  bots-perf-soak:
    name: Balance bots, perf budget, 3× soak to wave 300
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bots and perf budget
        working-directory: packages/onslaught_core
        run: dart test test/balance test/sim/perf_test.dart -r expanded
      - name: Soak
        working-directory: packages/onslaught_core
        run: dart test --run-skipped -t soak -r expanded

  android-emulator:
    name: Android emulator integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: flutter test integration_test -d emulator-5554

  ios-simulator:
    name: iOS simulator integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot a simulator and run
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter pub outdated --no-dev-dependencies --show-all
